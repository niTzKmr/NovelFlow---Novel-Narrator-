<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovelFlow Studio — First-Time AI Engine Setup</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0f0f12;
        color: #ececef;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }
      .card {
        width: 100%;
        max-width: 680px;
        background: #16161b;
        border: 1px solid #262632;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }
      .header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
      }
      .logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: rgba(212, 163, 115, 0.14);
        border: 1px solid rgba(212, 163, 115, 0.45);
        color: #d4a373;
        font-weight: 700;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: #f4f4f7;
      }
      .sub {
        margin: 4px 0 0;
        font-size: 13px;
        color: #9393a3;
      }
      .hw-box {
        background: #1b1b22;
        border: 1px solid #282834;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 12.5px;
        color: #c5c5d4;
        margin-bottom: 16px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .gold {
        color: #d4a373;
        font-weight: 600;
      }
      .modes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 18px;
      }
      .mode {
        background: #1a1a21;
        border: 1px solid #292935;
        border-radius: 12px;
        padding: 14px;
        cursor: pointer;
        text-align: left;
        color: inherit;
        transition: border-color 0.15s, background 0.15s;
      }
      .mode:hover {
        border-color: #464658;
      }
      .mode.active {
        background: #231e18;
        border-color: #d4a373;
      }
      .mode-title {
        font-size: 13.5px;
        font-weight: 600;
        color: #f4f4f7;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .badge {
        font-size: 10.5px;
        padding: 2px 7px;
        border-radius: 99px;
        background: rgba(212, 163, 115, 0.18);
        color: #d4a373;
        font-weight: 600;
      }
      .mode-desc {
        font-size: 11.5px;
        color: #9393a3;
        margin-top: 6px;
        line-height: 1.45;
      }
      .progress-wrap {
        margin-bottom: 14px;
        display: none;
      }
      .progress-wrap.visible {
        display: block;
      }
      .progress-head {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #d6d6e2;
        margin-bottom: 6px;
      }
      .bar {
        width: 100%;
        height: 8px;
        background: #252531;
        border-radius: 99px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        background: #d4a373;
        transition: width 0.25s ease;
      }
      .log {
        margin-top: 10px;
        height: 140px;
        overflow-y: auto;
        background: #101014;
        border: 1px solid #24242e;
        border-radius: 10px;
        padding: 10px;
        font-family: Consolas, "Courier New", monospace;
        font-size: 11px;
        color: #9b9baa;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .err {
        display: none;
        margin-bottom: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(239, 68, 68, 0.14);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fecaca;
        font-size: 12px;
      }
      .err.visible {
        display: block;
      }
      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
      }
      .note {
        font-size: 11.5px;
        color: #7c7c8c;
      }
      .btn-row {
        display: flex;
        gap: 10px;
      }
      button.primary {
        background: #d4a373;
        color: #141210;
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.secondary {
        background: #22222c;
        color: #e4e4ee;
        border: 1px solid #30303e;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 12.5px;
        cursor: pointer;
      }
      button.secondary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="logo">NF</div>
        <div>
          <h1>Download Local AI Voice Engine</h1>
          <p class="sub">One-time automatic setup. Once downloaded, NovelFlow Studio runs 100% offline.</p>
        </div>
      </div>

      <div class="hw-box">
        <span id="gpu-text">Detecting graphics hardware...</span>
        <span id="disk-text">Checking free disk space...</span>
      </div>

      <div class="modes">
        <button id="btn-cuda" class="mode" type="button">
          <div class="mode-title">
            <span>NVIDIA CUDA GPU</span>
            <span id="cuda-rec" class="badge" style="display: none">Recommended</span>
          </div>
          <div class="mode-desc">
            Downloads PyTorch CUDA 12.8 + Qwen3-TTS (~2.6 GB once). Fast GPU narration with CUDA Graphs on RTX GPUs.
          </div>
        </button>
        <button id="btn-cpu" class="mode" type="button">
          <div class="mode-title">
            <span>CPU Only Mode</span>
            <span id="cpu-rec" class="badge" style="display: none">Recommended</span>
          </div>
          <div class="mode-desc">
            Downloads lightweight CPU PyTorch + Qwen3-TTS (~320 MB once). Works on any Windows PC without an NVIDIA GPU.
          </div>
        </button>
      </div>

      <div id="err-box" class="err"></div>

      <div id="progress-wrap" class="progress-wrap">
        <div class="progress-head">
          <span id="step-label">Preparing local environment...</span>
          <span id="pct-label" class="gold">0%</span>
        </div>
        <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
        <div id="log-box" class="log"></div>
      </div>

      <div class="actions">
        <span class="note">After engine setup completes, you can pick & download Qwen3-TTS models inside the app.</span>
        <div class="btn-row">
          <button id="cancel-btn" class="secondary" type="button" style="display: none">Cancel</button>
          <button id="start-btn" class="primary" type="button">Download &amp; Install Engine</button>
        </div>
      </div>
    </div>

    <script>
      let selectedMode = "cpu";
      let installing = false;

      const btnCuda = document.getElementById("btn-cuda");
      const btnCpu = document.getElementById("btn-cpu");
      const cudaRec = document.getElementById("cuda-rec");
      const cpuRec = document.getElementById("cpu-rec");
      const gpuText = document.getElementById("gpu-text");
      const diskText = document.getElementById("disk-text");
      const startBtn = document.getElementById("start-btn");
      const cancelBtn = document.getElementById("cancel-btn");
      const progressWrap = document.getElementById("progress-wrap");
      const stepLabel = document.getElementById("step-label");
      const pctLabel = document.getElementById("pct-label");
      const barFill = document.getElementById("bar-fill");
      const logBox = document.getElementById("log-box");
      const errBox = document.getElementById("err-box");

      function selectMode(m) {
        if (installing) return;
        selectedMode = m;
        btnCuda.classList.toggle("active", m === "cuda");
        btnCpu.classList.toggle("active", m === "cpu");
      }

      btnCuda.addEventListener("click", () => selectMode("cuda"));
      btnCpu.addEventListener("click", () => selectMode("cpu"));

      function appendLog(line) {
        if (!line) return;
        logBox.textContent += line + "\n";
        logBox.scrollTop = logBox.scrollHeight;
      }

      window.novelflow.onAiSetupProgress((evt) => {
        if (evt.stage) stepLabel.textContent = evt.stage;
        if (typeof evt.percent === "number") {
          pctLabel.textContent = Math.round(evt.percent) + "%";
          barFill.style.width = Math.max(0, Math.min(100, evt.percent)) + "%";
        }
        if (evt.log) appendLog(evt.log);
        if (evt.error) {
          installing = false;
          startBtn.disabled = false;
          startBtn.textContent = "Retry Install";
          cancelBtn.style.display = "none";
          errBox.textContent = evt.error;
          errBox.classList.add("visible");
        }
      });

      startBtn.addEventListener("click", async () => {
        installing = true;
        errBox.classList.remove("visible");
        progressWrap.classList.add("visible");
        logBox.textContent = "";
        startBtn.disabled = true;
        startBtn.textContent = "Installing...";
        cancelBtn.style.display = "inline-block";
        try {
          await window.novelflow.startAiSetup(selectedMode);
        } catch (err) {
          installing = false;
          startBtn.disabled = false;
          startBtn.textContent = "Retry Install";
          cancelBtn.style.display = "none";
          errBox.textContent = err && err.message ? err.message : String(err);
          errBox.classList.add("visible");
        }
      });

      cancelBtn.addEventListener("click", async () => {
        cancelBtn.disabled = true;
        await window.novelflow.cancelAiSetup();
        installing = false;
        startBtn.disabled = false;
        startBtn.textContent = "Download & Install Engine";
        cancelBtn.style.display = "none";
        cancelBtn.disabled = false;
        stepLabel.textContent = "Installation canceled.";
      });

      (async () => {
        const info = await window.novelflow.getAiSetupInfo();
        gpuText.textContent = info.hasNvidiaGpu
          ? "Detected GPU: " + (info.gpuName || "NVIDIA CUDA GPU")
          : "GPU: " + (info.gpuName || "No NVIDIA CUDA GPU detected (CPU recommended)");
        diskText.textContent = "Free space: " + info.freeDiskGb + " GB";
        if (info.recommendedMode === "cuda") {
          cudaRec.style.display = "inline-block";
          selectMode("cuda");
        } else {
          cpuRec.style.display = "inline-block";
          selectMode("cpu");
        }
      })();
    </script>
  </body>
</html>
