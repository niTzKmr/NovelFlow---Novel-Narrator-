<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovelFlow</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b0c10;
        color: #f4f5f8;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .titlebar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 36px;
        -webkit-app-region: drag;
      }
      .stage {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 42%, rgba(229, 169, 94, 0.11), transparent 56%);
        padding: 32px;
      }
      .center {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .logo {
        margin-bottom: 18px;
        filter: drop-shadow(0 16px 36px rgba(0, 0, 0, 0.55));
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #f5f5f7;
      }
      .sub {
        margin: 6px 0 30px;
        font-size: 13px;
        color: #8f96aa;
      }
      .progress-track {
        width: 100%;
        height: 6px;
        background: #1b1e28;
        border: 1px solid #252a38;
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 6%;
        background: linear-gradient(90deg, #d49449, #e5a95e, #f1c382);
        border-radius: 999px;
        transition: width 0.35s ease;
      }
      .status-row {
        margin-top: 14px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: #a4aabb;
        gap: 12px;
      }
      .pct {
        color: #e5a95e;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        shrink: 0;
      }
      .hw-hint {
        margin-top: 8px;
        font-size: 11px;
        color: #6b7285;
      }
      .error-panel {
        display: none;
        margin-top: 20px;
        width: 100%;
        background: rgba(239, 68, 68, 0.09);
        border: 1px solid rgba(239, 68, 68, 0.32);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 12px;
        color: #fecaca;
        text-align: left;
      }
      .error-panel.visible {
        display: block;
      }
      .actions {
        margin-top: 16px;
        display: none;
        gap: 10px;
        align-items: center;
        justify-content: center;
      }
      .actions.visible {
        display: flex;
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 9px 18px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary {
        background: #e5a95e;
        color: #13110e;
      }
      button.secondary {
        background: #1b1e28;
        color: #d6dae6;
        border: 1px solid #2a3040;
      }
    </style>
  </head>
  <body>
    <div class="titlebar"></div>
    <main class="stage">
      <div class="center">
        <svg class="logo" width="88" height="88" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="#0F1117" stroke="rgba(229, 169, 94, 0.45)" stroke-width="1.5" />
          <rect x="4" y="4" width="56" height="56" rx="13.5" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
          <path d="M32 10.5C33.4 17.5 36.5 20.6 43.5 22C36.5 23.4 33.4 26.5 32 33.5C30.6 26.5 27.5 23.4 20.5 22C27.5 20.6 30.6 17.5 32 10.5Z" fill="#E5A95E" />
          <path d="M16 30.2C16 28.4 18.1 27.4 19.6 28.5L32 38.4L44.4 28.5C45.9 27.4 48 28.4 48 30.2V35.8L32 43.4L16 35.8V30.2Z" fill="#F4F5F8" />
          <path d="M16 41L32 47.2L48 41V45.6L32 51.8L16 45.6V41Z" fill="#F4F5F8" />
        </svg>

        <h1>NovelFlow</h1>
        <p class="sub">Local AI EPUB Reader &amp; Audiobook Studio</p>

        <div class="progress-track">
          <div id="bar-fill" class="progress-fill"></div>
        </div>

        <div class="status-row">
          <span id="status-text">Checking graphics hardware...</span>
          <span id="pct-text" class="pct">0%</span>
        </div>
        <div id="hw-hint" class="hw-hint">Downloading local voice resources (first launch only)</div>

        <div id="error-panel" class="error-panel"></div>
        <div id="actions" class="actions">
          <button id="retry-btn" class="primary" type="button">Retry Download</button>
          <button id="cpu-btn" class="secondary" type="button">Try CPU Mode</button>
        </div>
      </div>
    </main>

    <script>
      const barFill = document.getElementById("bar-fill");
      const statusText = document.getElementById("status-text");
      const pctText = document.getElementById("pct-text");
      const hwHint = document.getElementById("hw-hint");
      const errorPanel = document.getElementById("error-panel");
      const actions = document.getElementById("actions");
      const retryBtn = document.getElementById("retry-btn");
      const cpuBtn = document.getElementById("cpu-btn");

      let activeMode = "cpu";
      let running = false;

      window.novelflow.onAiSetupProgress((evt) => {
        if (evt.stage) statusText.textContent = evt.stage;
        if (typeof evt.percent === "number") {
          const p = Math.max(2, Math.min(100, Math.round(evt.percent)));
          barFill.style.width = p + "%";
          pctText.textContent = p + "%";
        }
        if (evt.error) {
          running = false;
          statusText.textContent = "Resource download paused";
          errorPanel.textContent = evt.error;
          errorPanel.classList.add("visible");
          actions.classList.add("visible");
        }
      });

      async function runSetup(mode) {
        if (running) return;
        running = true;
        activeMode = mode;
        errorPanel.classList.remove("visible");
        actions.classList.remove("visible");
        try {
          await window.novelflow.startAiSetup(mode, true);
        } catch (err) {
          running = false;
          statusText.textContent = "Download interrupted";
          errorPanel.textContent = err && err.message ? err.message : String(err);
          errorPanel.classList.add("visible");
          actions.classList.add("visible");
        }
      }

      retryBtn.addEventListener("click", () => runSetup(activeMode));
      cpuBtn.addEventListener("click", () => runSetup("cpu"));

      (async () => {
        try {
          const info = await window.novelflow.getAiSetupInfo();
          activeMode = info.recommendedMode;
          hwHint.textContent = info.hasNvidiaGpu
            ? `${info.gpuName || "NVIDIA GPU"} detected • Installing CUDA AI Engine & Narrator Model`
            : "Installing Lightweight CPU Voice Engine & Narrator Model";
          await runSetup(activeMode);
        } catch (err) {
          errorPanel.textContent = err && err.message ? err.message : String(err);
          errorPanel.classList.add("visible");
          actions.classList.add("visible");
        }
      })();
    </script>
  </body>
</html>
